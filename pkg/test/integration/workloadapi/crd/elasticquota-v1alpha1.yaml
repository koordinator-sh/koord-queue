# Minimal CRD for the koordinator-group ElasticQuota watched by the elasticquotav1alpha1
# (ElasticQuotaV2) plugin. The repo ships no CRD manifest for this type, so the envtest
# preemption suite installs this one. The plugin only reads .metadata (name/labels/annotations)
# and .spec.min/.spec.max, so the schema preserves unknown fields rather than enumerating them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticquotas.scheduling.sigs.k8s.io
  annotations:
    # scheduling.sigs.k8s.io is a protected group; the apiserver requires this approval annotation.
    api-approved.kubernetes.io: "https://github.com/kubernetes-sigs/scheduler-plugins/pull/52"
spec:
  group: scheduling.sigs.k8s.io
  names:
    kind: ElasticQuota
    listKind: ElasticQuotaList
    plural: elasticquotas
    singular: elasticquota
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true

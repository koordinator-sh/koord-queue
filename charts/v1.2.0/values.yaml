# Default values for koord-queue.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # the prefix of all image
  imagePrefix: ghcr.io

tolerations: []
isNeedNotebookExtension: false
oversellrate: 1
qps: 50
burst: 50
featureGates:
  QueueUnitConditions: true
  QueueUnitActive: false
  QueueUnitRequeueState: false
  MaximumExecutionTime: false

installation:
  namespace: koord-queue
  roleListGroups:
    - '*'

controller:
  image:
    repository: koordinator-sh/koord-queue
    tag: v1.9.0
  # resources of koord-queue-controller container
  queueGroupPlugin: elasticquotav2
  enableBlockingMode: false
  enableStrictPriority: false
  enableVisibilityServer: false
  enableResourceCheckWithScheduler: false
  defaultPreemptible: true
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

extension:
  jobextensions:
    repository: koordinator-sh/koord-queue-controllers
    tag: v1.9.0
    enablePodReclaim: false
    config:
      job:
        runningTimeout: "0s"
        backoffTimeout: "0s"
        partialRunningTimeout: "0s"
      tfjob:
        runningTimeout: "0s"
        backoffTimeout: "1m"
        partialRunningTimeout: "0s"
      pytorchjob:
        runningTimeout: "0s"
        backoffTimeout: "1m"
        partialRunningTimeout: "0s"
    resources:
      limits:
        memory: 2Gi
  ray:
    enable: false
  tf:
    enable: false
  pytorch:
    enable: false
  batchjob:
    enable: true
  argo:
    enable: false
  spark:
    enable: false
  mpi:
    enable: false

pluginConfigs: 
  apiVersion: scheduling.k8s.io/v1
  kind: KoordQueueConfiguration
  plugins: 
  - name: Priority
  - name: ElasticQuotaV2
  pluginConfigs: {}
#   ElasticQuota: 
#     checkHungryQuota: false
name: CI

on:
  push:
    branches:
    - main
    - release-*
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  golangci-lint:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod
    - uses: golangci/golangci-lint-action@v7
      with:
        version: latest

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-ut-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-ut-
    - name: Run unit tests
      run: make unit-test
    - name: Verify module files are unchanged
      run: git diff --exit-code -- go.mod go.sum

  build:
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod
    - name: Build both binaries
      run: make build

  integration-tests:
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-integration-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-integration-
    - name: Run integration tests
      run: make integration-test

  manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod
    - uses: azure/setup-helm@v4
      with:
        version: v3.18.6
    - name: Verify CRDs
      run: make verify-crd
    - name: Verify Helm chart
      run: make verify-helm
    - name: Verify module files are unchanged
      run: git diff --exit-code -- go.mod go.sum
